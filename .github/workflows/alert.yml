name: Twin Stock Trading Monitor

on:
  schedule:
    # 2 daily automated market sessions (Mon-Fri) that run continuous 5-minute loops:
    # Session 1: 13:25 UTC (starts 5 mins before 09:30 AM EDT open, covers morning until ~17:00 UTC)
    # Session 2: 17:00 UTC (01:00 PM EDT, covers afternoon until 16:00 EDT / 20:00 UTC market close)
    - cron: '25 13 * * 1-5'
    - cron: '0 17 * * 1-5'
  workflow_dispatch:
    inputs:
      loop:
        description: 'Run continuously in a 5-minute loop during market hours'
        required: false
        type: boolean
        default: true
      interval:
        description: 'Loop interval in seconds (default: 300 for 5 minutes)'
        required: false
        type: string
        default: '300'
      force:
        description: 'Bypass market hours check (run even if market is closed)'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Dry run (calculate metrics without sending emails)'
        required: false
        type: boolean
        default: false
      test_alert:
        description: 'Dispatch a test alert email to verify formatting and delivery'
        required: false
        type: boolean
        default: false

concurrency:
  group: twin-stock-trading-monitor
  cancel-in-progress: true

jobs:
  monitor:
    name: Intraday Pair Monitor
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Intraday Monitoring Script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM || 'onboarding@resend.dev' }}
          MARKET_TIMEZONE: ${{ vars.MARKET_TIMEZONE || 'America/New_York' }}
          PAIRS_CONFIG: ${{ vars.PAIRS_CONFIG || 'KO:PEP,V:MA,HD:LOW,XOM:CVX' }}
          Z_SCORE_THRESHOLD: '2.5'
          SUSTAINED_PERIODS: '2'
          ZERO_THRESHOLD: '0.25'
          ROLLING_WINDOW: '78'
          YFINANCE_DELAY_SECONDS: '1.0'
        run: |
          FLAGS=""
          if [ "${{ inputs.force }}" = "true" ]; then
            FLAGS="$FLAGS --force"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            FLAGS="$FLAGS --dry-run"
          fi
          if [ "${{ inputs.test_alert }}" = "true" ]; then
            FLAGS="$FLAGS --test-alert"
          fi
          # Default to continuous loop mode unless explicitly set to false
          if [ "${{ inputs.loop }}" != "false" ]; then
            FLAGS="$FLAGS --loop --interval ${{ inputs.interval || '300' }}"
          fi
          python monitor.py $FLAGS


